<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OutilsIA Local Cockpit</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f6f8;
        --surface: #ffffff;
        --text: #161b22;
        --muted: #5f6b78;
        --line: #d7dde4;
        --green: #16845b;
        --green-soft: #e6f5ee;
        --cyan: #087c96;
        --cyan-soft: #e4f4f7;
        --amber: #9a6511;
        --amber-soft: #fff2d8;
        --red: #a43838;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-width: 0; }
      body {
        padding: 12px;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }
      button, a { font: inherit; }
      .shell {
        width: min(100%, 680px);
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }
      .head {
        display: grid;
        grid-template-columns: 82px minmax(0, 1fr);
        gap: 16px;
        align-items: center;
        padding: 18px;
        border-bottom: 1px solid var(--line);
      }
      .score {
        display: grid;
        place-items: center;
        width: 82px;
        height: 82px;
        border: 7px solid var(--green);
        border-radius: 50%;
        background: var(--green-soft);
        color: var(--green);
      }
      .score strong { font-size: 25px; line-height: 1; }
      .score span { margin-top: 2px; color: var(--muted); font-size: 11px; }
      h1, h2, p { margin: 0; }
      h1 { font-size: 19px; line-height: 1.2; }
      h2 {
        margin-bottom: 10px;
        font-size: 13px;
        text-transform: uppercase;
        color: var(--muted);
      }
      .verdict { margin-top: 7px; font-size: 14px; line-height: 1.45; color: var(--muted); }
      .source {
        display: inline-flex;
        margin-top: 9px;
        padding: 4px 7px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--muted);
        font-size: 11px;
      }
      section { padding: 16px 18px; border-bottom: 1px solid var(--line); }
      section:last-of-type { border-bottom: 0; }
      .hardware {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }
      .metric { min-width: 0; }
      .metric span { display: block; margin-bottom: 3px; color: var(--muted); font-size: 11px; }
      .metric strong {
        display: block;
        overflow-wrap: anywhere;
        font-size: 13px;
        line-height: 1.35;
      }
      .models { display: grid; gap: 8px; }
      .model {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border-left: 3px solid var(--cyan);
        background: var(--cyan-soft);
      }
      .model strong, .model span { display: block; }
      .model strong { font-size: 14px; }
      .model span { margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.35; }
      .model code {
        max-width: 210px;
        overflow-wrap: anywhere;
        color: var(--cyan);
        font-size: 11px;
      }
      .proof, .purchase {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--line);
      }
      .proof strong, .purchase strong { display: block; font-size: 14px; }
      .proof span, .purchase span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }
      .proof b { color: var(--green); font-size: 17px; white-space: nowrap; }
      .purchase { background: var(--amber-soft); border-color: #e8cf9c; }
      .purchase[data-priority="none"] {
        background: var(--green-soft);
        border-color: #b8decf;
      }
      .purchase[data-priority="none"] strong { color: var(--green); }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 14px 18px 18px;
      }
      .link {
        appearance: none;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 8px 11px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        text-decoration: none;
        font-weight: 650;
        font-size: 12px;
      }
      .link[data-kind="download"] { border-color: var(--green); color: var(--green); }
      .limits {
        padding: 0 18px 16px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
      }
      .empty { padding: 28px 20px; text-align: center; color: var(--muted); }
      @media (max-width: 560px) {
        body { padding: 0; }
        .shell { border-right: 0; border-left: 0; border-radius: 0; }
        .head { grid-template-columns: 68px minmax(0, 1fr); padding: 14px; }
        .score { width: 68px; height: 68px; border-width: 6px; }
        .score strong { font-size: 21px; }
        .hardware { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        section { padding: 14px; }
        .model { grid-template-columns: 1fr; }
        .model code { max-width: none; }
        .proof, .purchase { grid-template-columns: 1fr; }
        .links { padding: 12px 14px 16px; }
        .limits { padding: 0 14px 14px; }
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101418;
          --surface: #171c21;
          --text: #f2f5f7;
          --muted: #a7b1bc;
          --line: #343d46;
          --green: #52c993;
          --green-soft: #152c23;
          --cyan: #5dc9dd;
          --cyan-soft: #14292e;
          --amber: #f0bf67;
          --amber-soft: #332817;
        }
        .purchase { border-color: #5d4928; }
        .purchase[data-priority="none"] { border-color: #2d5b48; }
      }
    </style>
  </head>
  <body>
    <main class="shell" id="app">
      <div class="empty">Préparation de la fiche OutilsIA…</div>
    </main>
    <script type="module">
      const app = document.querySelector("#app");
      let currentDecision = null;

      const escapeHtml = (value) => String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

      const metric = (label, value) => `
        <div class="metric"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>
      `;

      const render = (decision) => {
        if (!decision?.schema_version) return;
        currentDecision = decision;
        const machine = decision.machine || {};
        const score = decision.score || {};
        const models = Array.isArray(decision.recommended_models) ? decision.recommended_models : [];
        const proof = decision.benchmark_evidence;
        const purchase = decision.purchase || {};
        const links = Array.isArray(decision.links) ? decision.links : [];
        const limits = Array.isArray(decision.limits) ? decision.limits : [];
        const modelRows = models.length
          ? models.map((model) => `
              <div class="model">
                <div>
                  <strong>${escapeHtml(model.name)} ${escapeHtml(model.params)}</strong>
                  <span>${escapeHtml(model.label)} · ${escapeHtml(model.reason)}</span>
                </div>
                ${model.ollama ? `<code>ollama run ${escapeHtml(model.ollama)}</code>` : ""}
              </div>
            `).join("")
          : `<p class="verdict">Aucun modèle ne peut être classé avec les données reçues.</p>`;
        const proofBlock = proof
          ? `<section>
              <h2>Preuve mesurée</h2>
              <div class="proof">
                <div><strong>${escapeHtml(proof.model)}</strong><span>Benchmark sauvegardé par Local Cockpit</span></div>
                <b>${escapeHtml(proof.tokens_per_second)} tok/s</b>
              </div>
            </section>`
          : `<section>
              <h2>Preuve mesurée</h2>
              <div class="proof">
                <div><strong>Benchmark à faire</strong><span>OutilsIA n'invente pas de vitesse. Lancez le Cockpit sur le PC.</span></div>
              </div>
            </section>`;

        app.innerHTML = `
          <header class="head">
            <div class="score"><strong>${escapeHtml(score.value ?? 0)}</strong><span>/100</span></div>
            <div>
              <h1>${escapeHtml(decision.title || "OutilsIA")}</h1>
              <p class="verdict">${escapeHtml(decision.verdict || "")}</p>
              <span class="source">${escapeHtml(decision.source?.label || "")}</span>
            </div>
          </header>
          <section>
            <h2>Machine</h2>
            <div class="hardware">
              ${metric("CPU", machine.cpu || "Inconnu")}
              ${metric("RAM", `${machine.ram_gb || 0} Go`)}
              ${metric("GPU", machine.gpu || "Inconnu")}
              ${metric("VRAM", `${machine.vram_gb || 0} Go`)}
            </div>
          </section>
          <section>
            <h2>Modèles à tester</h2>
            <div class="models">${modelRows}</div>
          </section>
          ${proofBlock}
          <section>
            <h2>Décision matériel</h2>
            <div class="purchase" data-priority="${escapeHtml(purchase.priority || "none")}">
              <div>
                <strong>${escapeHtml(purchase.headline || "Aucune décision")}</strong>
                <span>${escapeHtml(purchase.summary || "")}</span>
              </div>
            </div>
          </section>
          <nav class="links">
            ${links.map((link) => `
              <button class="link" type="button" data-url="${escapeHtml(link.url)}" data-kind="${escapeHtml(link.kind)}">
                ${escapeHtml(link.label)}
              </button>
            `).join("")}
          </nav>
          <div class="limits">${limits.map((limit) => `<div>${escapeHtml(limit)}</div>`).join("")}</div>
        `;
      };

      const updateFromToolResult = (result) => {
        const decision = result?.structuredContent?.decision
          || result?.decision
          || result?.structuredContent;
        if (decision) render(decision);
      };

      app.addEventListener("click", (event) => {
        const button = event.target.closest("[data-url]");
        if (!button) return;
        const url = button.dataset.url;
        if (!url?.startsWith("https://outilsia.fr/")) return;
        if (typeof window.openai?.openExternal === "function") {
          window.openai.openExternal({ href: url });
        } else {
          window.open(url, "_blank", "noopener,noreferrer");
        }
      });

      let rpcId = 0;
      const pending = new Map();
      const rpcRequest = (method, params) => new Promise((resolve, reject) => {
        const id = ++rpcId;
        pending.set(id, { resolve, reject });
        window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      });
      const rpcNotify = (method, params) => {
        window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      };

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        if (typeof message.id === "number") {
          const request = pending.get(message.id);
          if (!request) return;
          pending.delete(message.id);
          if (message.error) request.reject(message.error);
          else request.resolve(message.result);
          return;
        }
        if (message.method === "ui/notifications/tool-result") {
          updateFromToolResult(message.params);
        }
      }, { passive: true });

      const initialize = async () => {
        try {
          await rpcRequest("ui/initialize", {
            appInfo: { name: "outilsia-machine-cockpit", version: "0.1.0" },
            appCapabilities: {},
            protocolVersion: "2026-01-26",
          });
          rpcNotify("ui/notifications/initialized", {});
        } catch (error) {
          console.error("MCP Apps bridge initialization failed:", error);
        }
      };

      if (window.openai?.toolOutput) updateFromToolResult({ structuredContent: window.openai.toolOutput });
      initialize();
    </script>
  </body>
</html>
