server {
    listen 80;
    listen [::]:80;
    server_name chatgpt-local-cockpit.outilsia.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors https://chatgpt.com https://*.chatgpt.com https://chat.openai.com https://*.openai.com" always;

    location = /healthz {
        default_type text/plain;
        return 200 "OutilsIA ChatGPT widget origin: ok\n";
    }

    location / {
        default_type text/plain;
        return 200 "OutilsIA Local Cockpit - dedicated ChatGPT widget origin\n";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chatgpt-local-cockpit.outilsia.fr;

    ssl_certificate /etc/letsencrypt/live/chatgpt-local-cockpit.outilsia.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatgpt-local-cockpit.outilsia.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors https://chatgpt.com https://*.chatgpt.com https://chat.openai.com https://*.openai.com" always;

    location = /healthz {
        default_type text/plain;
        return 200 "OutilsIA ChatGPT widget origin: ok\n";
    }

    location / {
        default_type text/plain;
        return 200 "OutilsIA Local Cockpit - dedicated ChatGPT widget origin\n";
    }
}
