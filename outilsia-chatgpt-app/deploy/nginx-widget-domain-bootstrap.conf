server {
    listen 80;
    listen [::]:80;
    server_name chatgpt-local-cockpit.outilsia.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        default_type text/plain;
        return 200 "OutilsIA ChatGPT widget origin bootstrap\n";
    }
}
