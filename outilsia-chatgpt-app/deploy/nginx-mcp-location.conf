# Place inside every outilsia.fr origin server block used by the CDN.
# Prefer Cloudflare Full (strict); keeping the exact route on HTTP too makes
# the MCP endpoint robust while that origin setting is migrated.
location = /mcp {
    proxy_pass http://127.0.0.1:8787/mcp;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
