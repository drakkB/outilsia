name: OutilsIA ChatGPT App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "outilsia-chatgpt-app/**"
      - "server-work/static/llms.txt"
      - "server-work/static/pages/chatgpt-ia-locale.html"
      - "server-work/static/pages/conditions-plugin-outilsia.html"
      - "server-work/static/pages/scanner-ia-local.html"
      - ".github/workflows/outilsia-chatgpt-app.yml"
  pull_request:
    paths:
      - "outilsia-chatgpt-app/**"
      - "server-work/static/llms.txt"
      - "server-work/static/pages/chatgpt-ia-locale.html"
      - "server-work/static/pages/conditions-plugin-outilsia.html"
      - "server-work/static/pages/scanner-ia-local.html"
      - ".github/workflows/outilsia-chatgpt-app.yml"

permissions:
  contents: read

concurrency:
  group: outilsia-chatgpt-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: outilsia-chatgpt-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: outilsia-chatgpt-app/package-lock.json
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Verify MCP contract and tests
        run: npm run verify
